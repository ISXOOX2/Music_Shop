# Nombre del microservicio (Identificador en Eureka)
spring.application.name=pedido-service

# Puerto único para este servicio
server.port=8089

# Conexión a la Base de Datos única Compartida
spring.datasource.url=jdbc:mysql://localhost:3306/music_shop
spring.datasource.username=root
spring.datasource.password=

# Configuración JPA e Hibernate (Tal como lo pide tu plantilla)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Flyway (Si no usas scripts de migración aún, puedes ponerlo en false)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# Conexión al Servidor Eureka (Para que este microservicio se registre)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka