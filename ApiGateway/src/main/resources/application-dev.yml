spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: bodega-route
          uri: lb://bodega
          predicates:
            - Path=/api/bodegas/**
        - id: cliente-route
          uri: lb://cliente
          predicates:
            - Path=/api/clientes/**
        - id: sucursal-route
          uri: lb://sucursal
          predicates:
            - Path=/api/sucursales/**
        - id: descuento-route
          uri: lb://descuento
          predicates:
            - Path=/api/descuentos/**
        - id: proveedor-route
          uri: lb://proveedor
          predicates:
            - Path=/api/proveedores/**
        - id: producto-route
          uri: lb://producto
          predicates:
            - Path=/api/productos/**
        - id: empleado-route
          uri: lb://empleado
          predicates:
            - Path=/api/empleados/**
        - id: inventario-route
          uri: lb://inventario
          predicates:
            - Path=/api/inventarios/**
        - id: pedido-route
          uri: lb://pedido
          predicates:
            - Path=/api/pedidos/**
        - id: pago-route
          uri: lb://pago
          predicates:
            - Path=/api/pagos/**
        - id: devolucion-route
          uri: lb://devolucion
          predicates:
            - Path=/api/devoluciones/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always