spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=bodega-route
spring.cloud.gateway.routes[0].uri=lb://bodega
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/bodegas/**

spring.cloud.gateway.routes[1].id=cliente-route
spring.cloud.gateway.routes[1].uri=lb://cliente
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/clientes/**

