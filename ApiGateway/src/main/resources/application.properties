spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway routes (rutas que reenvía a cada microservicio)
spring.cloud.gateway.routes[0].id=bodega
spring.cloud.gateway.routes[0].uri=lb://bodega
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/bodegas/**

spring.cloud.gateway.routes[1].id=cliente
spring.cloud.gateway.routes[1].uri=lb://cliente
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/clientes/**

spring.cloud.gateway.routes[2].id=sucursal
spring.cloud.gateway.routes[2].uri=lb://sucursal
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/sucursales/**

spring.cloud.gateway.routes[3].id=descuento
spring.cloud.gateway.routes[3].uri=lb://descuento
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/descuentos/**

# Actuator para health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always