version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: music_shop_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: music_shop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - music_shop_network

  eureka-server:
    build: ./EurekaServer
    container_name: eureka_server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - music_shop_network

  api-gateway:
    build: ./ApiGateway
    container_name: api_gateway
    restart: unless-stopped
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  bodega:
    build: ./bodega
    container_name: bodega_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  cliente:
    build: ./cliente
    container_name: cliente_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  descuento:
    build: ./descuento
    container_name: descuento_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  devolucion-garantia:
    build: ./devolucionGarantia
    container_name: devolucion_garantia_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  empleado:
    build: ./empleado
    container_name: empleado_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  producto:
    build: ./producto
    container_name: producto_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  inventario:
    build: ./inventario
    container_name: inventario_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
      - producto
      - sucursal
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  pago:
    build: ./pago
    container_name: pago_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
      - pedido
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  pedido:
    build: ./pedido
    container_name: pedido_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  proveedor:
    build: ./proveedor
    container_name: proveedor_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

  sucursal:
    build: ./sucursal
    container_name: sucursal_service
    restart: unless-stopped
    depends_on:
      - mysql
      - eureka-server
    ports:
      - "8091:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/music_shop
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - music_shop_network

volumes:
  mysql_data:

networks:
  music_shop_network:
    driver: bridge